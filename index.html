<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>温室夜班补光排程台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>温室夜班补光排程台</h1>
    <p class="sub">四层苗架 · 一层一灯 · 病害苗优先</p>
  </div>
  <div class="clock">现在时刻<br><span id="now">--:--:--</span></div>
</header>

<main>
  <section class="panel">
    <h2>① 登记批次</h2>
    <form id="batch-form">
      <label>品种
        <input type="text" id="f-variety" required placeholder="如：番茄·合作903">
      </label>
      <label>剩余补光（分钟）
        <input type="number" id="f-remaining" required min="1" step="1" placeholder="90">
      </label>
      <label>完成期限
        <input type="datetime-local" id="f-deadline" required>
      </label>
      <label>病害等级
        <select id="f-disease">
          <option value="0">无（普通苗）</option>
          <option value="1">轻</option>
          <option value="2">重</option>
        </select>
      </label>
      <button type="submit">登记并入排程</button>
    </form>
  </section>

  <section class="panel">
    <h2>② 苗架（四层，一层一灯）</h2>
    <div id="layers" class="layers"></div>
    <div class="actions">
      <button id="btn-reschedule" type="button">重新排程</button>
      <button id="btn-reset" type="button" class="danger">清空全部数据</button>
    </div>
    <div id="conflicts" class="conflicts"></div>
  </section>

  <section class="panel">
    <h2>③ 批次档案</h2>
    <table id="batch-table">
      <thead>
        <tr>
          <th>品种</th><th>剩余(分)</th><th>完成期限</th><th>病害</th><th>状态</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="js/batches.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/app.js"></script>
</body>
</html>
